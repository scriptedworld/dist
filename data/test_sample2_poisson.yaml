---
name: Runner
redis_host: localhost
redis_port: 6379
redis_pass: slenderman
base_attributes_file_path: data/tests/base_attributes.yaml
report_interval_seconds: 5
log_dir: ./
use_poisson: true   # Must be true or false
continuous: false   # Must be true or false
