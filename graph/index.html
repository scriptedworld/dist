<html>
<head>
<title>Dist Graphs</title>

<link href="/stylesheets/application.css" media="all" rel="stylesheet" type="text/css"/>

<script language="javascript" src="javascripts/jquery-2.0.3.js" type="text/javascript"></script>

<script language="javascript" src="javascripts/flot/jquery.flot.js" type="text/javascript"></script>
<script language="javascript" src="javascripts/flot/jquery.flot.time.js" type="text/javascript"></script>

<link href="/javascripts/jquery-ui/css/ui-lightness/jquery-ui-1.10.3.custom.css" media="all" rel="stylesheet" type="text/css"/>
<script language="javascript" src="javascripts/jquery-ui/js/jquery-ui-1.10.3.custom.js" type="text/javascript"></script>

<script language="javascript" src="javascripts/dynatree/jquery/jquery.cookie.js" type="text/javascript"></script>

</head>
<body>
<table>
  <tr>
    <td class="navigation" rowspan='2'>
      <!-- Navigation controls go here. -->
      <table>
        <tr><td>
	  <input type='text' id='name_filter'/>
        </td></tr>
        <tr><td>
          <!-- Metrics Select goes here. -->
          <select id='metric_names' size=20 multiple >
            <option>Populating, please wait.</option>
          </select>
        </td></tr>
        <tr><td>
          <!-- Slider for time selection goes here. -->
          <div id='metrics_timestamp_range'></div>
          <div id='metrics_timestamp_range_text'>
            <div id='min_label'>From:</div><div id='min_timestamp'></div>
            <div id='max_label'>To:</div><div id='max_timestamp'></div>
            <input type='hidden' id='curr_min_value'/> <input type='hidden' id='curr_max_value'/>
          </div>
        </td></tr>
        <tr><td>
          <!-- Buttons go here. -->
          <button id='metrics_redraw_partial'>Show Selected!</button>
          <button id='metrics_redraw_all'>Show All!</button>
        </td></tr>
        <tr><td>
          <!-- Checkbox for auto-refresh goes here. -->
          <input id='metrics_refresh' type='checkbox'>Refresh every 30sec</input>
        </td></tr>
      </table>
    </td>
    <td class="graph_container" width="*">
      <!-- Graph goes here. -->
      <div id="placeholder" class="graph_placeholder"></div>
      <br>
      <div id="static_link_placeholder"></div>
    </td>
  </tr>
  <tr>
    <td>
      <!-- TODO: Stats go here. -->
    </td>
  </tr>
</table>

<script language="javascript" src="javascripts/app.js" type="text/javascript"></script>
</body>
